<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11657f"/>
      <stop offset="0.55" stop-color="#0a3543"/>
      <stop offset="1" stop-color="#071d26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#2a9bbb" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2a9bbb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e09706"/>
      <stop offset="1" stop-color="#fbb11b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#020c11" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- speech bubble = social conversation -->
  <g filter="url(#shadow)">
    <path d="M330 250 H694 a118 118 0 0 1 118 118 V598 a118 118 0 0 1 -118 118 H450 L322 812 C312 819 300 812 302 800 L318 716 h0 a118 118 0 0 1 -106 -118 V368 a118 118 0 0 1 118 -118 Z"
          fill="#ffffff"/>
  </g>

  <!-- rising bars = analytics / growth -->
  <rect x="338" y="508" width="92" height="130" rx="30" fill="#0f5f78"/>
  <rect x="466" y="430" width="92" height="208" rx="30" fill="#094053"/>
  <rect x="594" y="342" width="92" height="296" rx="30" fill="url(#gold)"/>

</svg>
